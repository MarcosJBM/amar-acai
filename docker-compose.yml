version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amar-acai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: amar
      POSTGRES_PASSWORD: acai123
      POSTGRES_DB: amar_acai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amar -d amar_acai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
